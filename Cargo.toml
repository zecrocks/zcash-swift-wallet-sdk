[package]
name = "libzcashlc"
version = "5.0.0"
authors = [
  "Jack Grigg <thestr4d@gmail.com>",
  "Lukas Korba <lukas@zodl.com>",
  "Kris Nuttycombe<kris@nutty.land>",
  "Francisco Gindre",
]
license = "MIT"
edition = "2024"
rust-version = "1.90"
build = "rust/build.rs"

[dependencies]

# Zcash
orchard = { version = "0.16" }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
transparent = { package = "zcash_transparent", version = "0.11", default-features = false }
zcash_address = { version = "0.14" }
zcash_client_backend = { version = "0.25", features = [
  "lightwalletd-tonic-tls-webpki-roots",
  "orchard",
  "pczt",
  "tor",
  "transparent-inputs",
  "unstable",
] }
zcash_client_sqlite = { version = "0.23", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_note_encryption = "0.5"
zcash_primitives = "0.31"
zcash_proofs = "0.31"
zcash_protocol = { version = "0.11", features = ["local-consensus"] }
zcash_pool_migration = { version = "0.2", features = ["wallet"] }
zcash_script = "0.6"
zip32 = "0.3"
pczt = { version = "0.10", features = ["prover", "orchard", "sapling", "signer"] }
shardtree = "0.8"

# Keystone hardware-wallet batch signing for the Orchard migration flow.
#
# Bypasses the compiled Keystone mobile SDKs (stale — single-PCZT only, no batch API) by
# depending directly on `keystone-sdk-rust`'s `ur-registry` crate and `ur-rs` from git, mirroring
# `chainapsis/vizor-wallet`'s verified-working pattern for the same integration (see
# `rust/src/migration_keystone.rs`'s module doc). The actual batching primitive is
# `pczt::roles::signer::batch` (the `signer` feature above), not Keystone-specific; these crates
# only provide the outer UR/QR envelope. `ur-registry`'s Zcash batch-signing types haven't reached
# a tagged release yet — Android's SDK floats this branch and its lock resolves exactly this rev;
# we pin it directly instead.
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
ur-registry = { git = "https://github.com/KeystoneHQ/keystone-sdk-rust", rev = "7c90bf1ae504720c3f4b44ff26f996836d8b1553", package = "ur-registry", default-features = false, features = [
    "std",
] }

# EIP-681
eip681 = "0.1.0"

# Infrastructure
prost = "0.14"
rusqlite = "0.37"
schemerz = "0.3"
schemerz-rusqlite = "0.371"
secrecy = "0.8"
rand = "0.10"
nonempty = "0.11"

# FFI
anyhow = "1.0"
ffi_helpers = "0.3"
uuid = "1.1"
bitflags = "2"

# HTTP
bytes = "1"
http = "1"
http-body-util = "0.1"

# Initialization
cfg-if = "1.0"
rayon = "1.7"

# lightwalletd
tonic = "0.14"

# Logging
log-panics = "2.0"
once_cell = "1.0"
sharded-slab = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tor
fs-mistrust = "0.14"
tor-rtcompat = "0.43"
rust_decimal = { version = "1", default-features = false, features = ["c-repr"] }
# - The "static" feature is required for the "compression" default feature of arti-client.
xz2 = { version = "0.1", features = ["static"] }

# Zcash voting (optional; see the `voting` feature).
#
# Shielded voting is disabled: `zcash_voting` has no stable release built against the
# librustzcash crate line this SDK uses (NU7: zcash_protocol 0.11 / orchard 0.16). The last
# release the voting module was written against (`=3.0.0`) pins librustzcash 0.24-rc / orchard
# 0.15 and cannot be resolved alongside this crate set, and Cargo resolves optional dependencies
# into `Cargo.lock` even when their feature is off, so `zcash_voting` itself is not declared
# here. Re-enabling voting means adding a compatible, permissively licensed `zcash_voting`
# release as an optional dependency and listing it in the `voting` feature below.
zeroize = { version = "1", optional = true }
pasta_curves = { version = "0.5", optional = true }
ff = { version = "0.13", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# Used by the pool-migration engine as well as by voting.
zcash_keys = { version = "0.17", features = ["orchard"] }
incrementalmerkletree = { version = "0.9", default-features = false }

[dev-dependencies]
hex = "0.4"
tempfile = "3"

[build-dependencies]
bindgen = "0.72"
cbindgen = "0.29"
cc = "1.0"

[features]
default = []
# Shielded voting FFI (the `rust/src/voting` module and its `zcashlc_*` exports). Disabled by
# default and currently unbuildable: enabling it fails with a `compile_error!` until a
# compatible `zcash_voting` dependency is added (see the comment on the voting dependencies).
voting = [
  "dep:zeroize",
  "dep:pasta_curves",
  "dep:ff",
  "dep:serde",
  "dep:serde_json",
]

[lib]
name = "zcashlc"
path = "rust/src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
lto = true

[patch.crates-io]
# DO NOT ALTER THIS COMMENT
#
# This section is left in place to ensure that development against in-progress
# librustzcash changes my proceed. DO NOT merge a PR that chooses unstable
# revisions; such a revision need not be merged to `librustzcash `main` but the
# author and reviewer should have certainty that the revision *will end up
# merged to `main`* so that commits in our history can always be successfully
# built.
